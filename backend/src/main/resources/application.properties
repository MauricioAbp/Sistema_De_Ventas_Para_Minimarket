spring.application.name=gruposowad

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.bootstrap.admin.username=${ADMIN_USERNAME:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
